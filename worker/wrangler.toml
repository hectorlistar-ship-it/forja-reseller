name = "forja-reseller"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "91fa55eaae4ace9b17638f75006e1b7e"

assets = { directory = "./assets" }

# Cron: revisa cada 5 min si es hora de publicar promos diarias (08:30 / 14:00 local)
[triggers]
crons = ["*/5 * * * *"]

[vars]
ENVIRONMENT = "production"
BOT_NAME = "Asistente"
BUSINESS_NAME = "1NEGOCIOENWEB"
BOT_LANGUAGE = "es-MX"
BUFFER_SECONDS = "15"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "forja-reseller"
database_id = "3a5a237a-dbcb-4bf6-85cf-4d935cc396e5"

# Secrets (set via: wrangler secret put SECRET_NAME)
# TELEGRAM_BOT_TOKEN
# DASHBOARD_PASSWORD
# BRIDGE_TOKEN
# JWT_SECRET
# GMAIL_USER
# GMAIL_APP_PASSWORD
# ENCRYPTION_KEY        (32 random bytes, base64 - e.g. `openssl rand -base64 32`)
# TELEGRAM_ADMIN_CHAT_ID